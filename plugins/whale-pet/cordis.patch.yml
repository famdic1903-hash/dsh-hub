# ============================================================================
# @local/dsh-whale-pet —— 把「余额小鲸鱼」挂件跳出 DSH 窗口
# ============================================================================
# 这一层把 Host 半（状态 / HTTP 控制路由 / 桌面宠物进程管理）和 Client 半
# （会话输入框下方的切换按钮）一起挂进 desktop profile。
# 安装：plugin_manager -> install_bundle，target 为本目录绝对路径。

- insert:
    - id: whale-pet
      name: '@local/dsh-whale-pet'
